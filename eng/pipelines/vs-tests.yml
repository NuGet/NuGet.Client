# This is a pipeline that will run NuGet.Client's Visual Studio integration tests

pr: none
trigger:
  branches:
    include:
    - dev-*

parameters:
# Specific tests
- name: RunApexTests
  displayName: Run Apex tests
  type: boolean
  default: true
- name: RunEndToEndTests
  displayName: Run end-to-end tests
  type: boolean
  default: true
- name: EnableApexBlameHangDumpCollector
  displayName: Collect Apex hang dumps (aborts the test run on timeout)
  type: boolean
  default: false

# Dartlab options
- name: DartLabEnvironment
  displayName: DartLab Environment
  type: string
  default: Production
  values:
  - Production
  - Staging
- name: testMachineHoldStrategy
  displayName: Hold E2E test machine for debugging
  type: string
  default: None
  values:
  - None
  - Completion
  - Execution
  - Failure
  - Timeout
- name: ApexAgentCleanup
  displayName: Cleanup VS Apex test machine
  type: string
  default: Always
  values:
    - Always
    - Never
    - OnSuccess

resources:
  pipelines:
  - pipeline: DartLab
    source: DartLab
    version: '20260923.1' # TODO: revert
  repositories:
  # DartLab1ES/CloudTest templates repository
  - repository: DartLabTemplates
    type: git
    name: DevDiv/DartLab
    ref: refs/heads/main # TODO: revert

variables:
  DOTNET_NOLOGO: 1
  CI: true
  Codeql.Enabled: false
  SourceBranch: $[replace(variables['Build.SourceBranch'], 'refs/heads/', '')]

stages:
- stage: Build
  displayName: Build NuGet and tests
  condition: false # TODO: revert after validating VS_EndToEnd
  jobs:
  - job: Build
    timeoutInMinutes: 170
    pool:
      name: VSEng-MicroBuildVSStable
    steps:
    - template: vs-test/build.yml
      parameters:
        enableApexBlameHangDumpCollector: ${{parameters.EnableApexBlameHangDumpCollector}}

- template: vs-test/end_to_end.yml
  parameters:
    stageName: VS_EndToEnd
    stageDisplayName: On Windows
    condition: "and(succeeded(), ne(variables['RunEndToEndTests'], 'false'))"
    dependsOn: []
    artifactRunId: 15428374 # TODO: revert after validating VS_EndToEnd
    DartLabEnvironment: ${{parameters.DartLabEnvironment}}
    testExecutionJobTimeoutInMinutes: 412 # cloud test minimum
    testMachineHoldStrategy: ${{parameters.testMachineHoldStrategy}}

