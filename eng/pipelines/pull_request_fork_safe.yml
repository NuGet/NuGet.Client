trigger: none

# Start as an explicitly queued pipeline while its output is compared with
# PrivateDev. A PR or comment trigger can be enabled after that validation.
pr: none

variables:
  BuildConfiguration: Release
  CI: true
  DOTNET_NOLOGO: 1
  NUGET_EXPERIMENTAL_CHAIN_BUILD_RETRY_POLICY: 3,1000
  SkipSigning: true
  SourceBranch: $[replace(variables['Build.SourceBranch'], 'refs/heads/', '')]

stages:
- stage: Initialize
  jobs:
  - job: SetBuildNumber
    displayName: Set build number
    pool:
      name: NetCore-Public
      demands: ImageOverride -equals Windows.VS2026.Amd64.Open
    steps:
    - checkout: self
      persistCredentials: false

    - task: PowerShell@2
      name: buildNumber
      displayName: Calculate build number
      inputs:
        targetType: inline
        script: |
          $semanticVersion = ((dotnet msbuild build\config.props /restore:false "/ConsoleLoggerParameters:Verbosity=Minimal;NoSummary;ForceNoAlign" /nologo /target:GetSemanticVersion) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to calculate the semantic version."
          }

          # VSIX versions use a UInt16 revision. BuildId gives fork builds a stable,
          # pipeline-local value without requiring a shared counter or protected resource.
          $revision = [int64]$env:BUILD_BUILDID % 65535
          if ($revision -eq 0) {
            $revision = 1
          }

          $fullBuildNumber = "$semanticVersion.$revision"
          Write-Host "##vso[build.updatebuildnumber]$fullBuildNumber"
          Write-Host "##vso[task.setvariable variable=BuildNumber;isOutput=true]$revision"

- stage: Build
  dependsOn: Initialize
  jobs:
  - job: Build_NonRTM
    displayName: Validate NuGet inserted into Visual Studio and the .NET SDK
    timeoutInMinutes: 170
    variables:
      BuildNumber: $[stageDependencies.Initialize.SetBuildNumber.outputs['buildNumber.BuildNumber']]
      BuildRTM: false
      NupkgOutputDir: Nupkgs
    pool:
      name: NetCore-Public
      demands: ImageOverride -equals Windows.VS2026.Amd64.Open
    steps:
    - template: templates/Build.ForkSafe.yml
      parameters:
        BuildRTM: false
