trigger:
  branches:
    include:
    - main

variables:
- group: 'Connected Experience'
- name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
  value: true
- name: NUGET_PACKAGES
  value: $(Agent.TempDirectory)/.nuget/packages
- name: DisableOptProf
  value: false

stages:
- stage: Build
  jobs:
  - job: Windows
    timeoutInMinutes: 300
    # pool: VS-Platform-Cache-Generation
    pool: VSEngSS-MicroBuild2022-1ES
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET Core sdk defined in global.json'
      inputs:
        version: '9.0.x'
        includePreviewVersions: true
    - task: NuGetToolInstaller@0
      displayName: Install Nuget

    - task: NuGetAuthenticate@1
      displayName: Authenticate NuGet feeds
      inputs:
        forceReinstallCredentialProvider: true

    - script: |
        dir c:\
        dir "c:\program files\microsoft visual studio\2022"
        dir "C:\Program Files (x86)\Microsoft Visual Studio\Installer"
      displayName: 'Inspect Drives'

    - powershell: |
        ./scripts/Install-Workloads.ps1
      displayName: Install Workloads

    - task: NuGetCommand@2
      displayName: 'Install AzureBlobStorage'
      inputs:
        command: custom
        arguments: 'install Microsoft.MSBuildCache.AzureBlobStorage -OutputDirectory $(Agent.TempDirectory) -ExcludeVersion -Prerelease -Verbosity detailed'

    - task: NuGetCommand@2
      displayName: 'Install MS SharedCompilation'
      inputs:
        command: custom
        arguments: 'install Microsoft.MSBuildCache.SharedCompilation -OutputDirectory $(Agent.TempDirectory) -ExcludeVersion -Prerelease'

    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          $CacheEnlistmentRoot = [IO.Path]::GetFullPath("$PSScriptRoot\..\..")

          Write-Host "Copying cache_build.props and cache_build.targets to the ImportBefore and ImportAfter folders respectively"
          $LocalAppDataFolder = $Env:LOCALAPPDATA
          $ImportAfterFolder = Join-Path $LocalAppDataFolder "Microsoft\MSBuild\Current\Imports\Microsoft.Common.props\ImportAfter"
          $ImportBeforeFolder = Join-Path $LocalAppDataFolder "Microsoft\MSBuild\Current\Imports\Microsoft.Common.props\ImportBefore"

          New-Item -Path $ImportBeforeFolder -ItemType Directory -Force | Out-Null
          New-Item -Path $ImportAfterFolder -ItemType Directory -Force | Out-Null
          Copy-Item -Path "$PSScriptRoot\cache_build.props" -Destination $ImportBeforeFolder -Force
          Copy-Item -Path "$PSScriptRoot\cache_build.targets" -Destination $ImportAfterFolder -Force

          # Set the cache log directory so we tell it where to go
          $Env:MSBuildCacheLogDirectory = "$Env:Agent_TempDirectory\MSBuildCacheLogs"
          $Env:MSBuildCacheLocalCacheRootPath = "$Env:Agent_TempDirectory\MSBuildCacheLocalRoot"

          # Set the location for the cache auth file
          $Env:MSBuildCacheBuildCacheConfigurationFile = 'c:\buildcacheconfig.json'

    - task: MSBuild@1
      displayName: 'Build target'
      inputs:
        solution: 'Nuget.sln'
        msbuildVersion: 'latest'
        msbuildArchitecture: x64
        configuration: Debug
        platform: "Any CPU"
        logFileVerbosity: minimal
        msbuildArguments: "/t:Build /graph /reportfileaccesses /m:1 /bl:$(Agent.TempDirectory)\\MSBuildBuildBinLog\\build.binlog"

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Logs'
      inputs:
        targetPath: '$(Agent.TempDirectory)\MSBuildBuildBinLog'
        artifact: MSBuildBuildBinLog
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Cache Logs'
      inputs:
        targetPath: '$(Agent.TempDirectory)\MSBuildCacheLogs'
        artifact: MSBuildCacheLogs
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Cache Logs'
      inputs:
        targetPath: '$(Agent.TempDirectory)\MSBuildCacheLocalRoot'
        artifact: MSBuildCacheLocalRoot
      condition: always()
