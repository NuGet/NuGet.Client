trigger:
  branches:
    include:
    - main

stages:
- stage: Build
  jobs:
  - job: Windows
    timeoutInMinutes: 300
    # pool: VS-Platform-Cache-Generation
    pool: VSEngSS-MicroBuild2022-1ES
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET Core sdk 9.0.300-preview.0.25127.19
      inputs:
        version: '9.0.300-preview.0.25127.19'
        includePreviewVersions: true
    - task: NuGetToolInstaller@0
      displayName: Install Nuget

    - task: NuGetAuthenticate@1
      displayName: Authenticate NuGet feeds
      inputs:
        forceReinstallCredentialProvider: true

    - script: |
        dir c:\
        dir "c:\program files\microsoft visual studio\2022"
        dir "C:\Program Files (x86)\Microsoft Visual Studio\Installer"
      displayName: 'Inspect Drives'

    - powershell: |
        ./scripts/Install-Workloads.ps1
      displayName: Install Workloads

    - task: NuGetCommand@2
      displayName: 'Install AzureBlobStorage'
      inputs:
        command: custom
        arguments: 'install Microsoft.MSBuildCache.AzureBlobStorage -OutputDirectory $(Agent.TempDirectory) -ExcludeVersion -Prerelease -Verbosity detailed'

    - task: NuGetCommand@2
      displayName: 'Install MS SharedCompilation'
      inputs:
        command: custom
        arguments: 'install Microsoft.MSBuildCache.SharedCompilation -OutputDirectory $(Agent.TempDirectory) -ExcludeVersion -Prerelease'

    - pwsh: build/cachebuild/prepare_cache_build.ps1
      displayName: 'Prerequisites'

    - task: MSBuild@1
      displayName: 'Build Nuget.sln'
      inputs:
        solution: 'Nuget.sln'
        msbuildVersion: 'latest'
        msbuildArchitecture: x64
        configuration: Debug
        platform: "Any CPU"
        logFileVerbosity: minimal
        msbuildArguments: "/t:Build /graph /reportfileaccesses /m:1 /bl:$(Agent.TempDirectory)\\MSBuildBuildBinLog\\build.binlog"
      env:
        MSBuildCacheLogDirectory: $(MSBuildCacheLogDirectory)
        MSBuildCacheLocalCacheRootPath: $(MSBuildCacheLocalCacheRootPath)
        MSBuildCacheBuildCacheConfigurationFile: $(MSBuildCacheBuildCacheConfigurationFile)

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Logs'
      inputs:
        targetPath: '$(Agent.TempDirectory)\MSBuildBuildBinLog'
        artifact: MSBuildBuildBinLog
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Cache Logs'
      inputs:
        targetPath: '$(Agent.TempDirectory)\MSBuildCacheLogs'
        artifact: MSBuildCacheLogs
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Cache Logs'
      inputs:
        targetPath: '$(Agent.TempDirectory)\MSBuildCacheLocalRoot'
        artifact: MSBuildCacheLocalRoot
      condition: always()
